# Configuration Netlify : Netlify reconstruit le site à chaque push sur GitHub
# et publie le dossier dist/ (HTML, CSS, images).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# En-têtes de sécurité envoyés avec chaque fichier (avant : src/middleware.ts sur le VPS)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Les fichiers de /_astro/ ont un nom qui change à chaque modification : on peut les garder un an en cache
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

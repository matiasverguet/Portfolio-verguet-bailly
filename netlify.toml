# Configuration de l'hébergement Netlify (lue automatiquement à chaque déploiement depuis GitHub)

[build]
  command = "npm run build"   # Astro génère le site dans dist/
  publish = "dist"            # dossier mis en ligne

[build.environment]
  NODE_VERSION = "22"
  # PB_URL (adresse du PocketBase sur le VPS) se règle dans l'interface Netlify,
  # pas ici : Site configuration → Environment variables.

# En-têtes de sécurité envoyés avec chaque page
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"           # le navigateur ne devine pas le type des fichiers
    Referrer-Policy = "strict-origin-when-cross-origin"  # n'envoie pas l'adresse complète aux sites tiers
    X-Frame-Options = "DENY"                     # le site ne peut pas être affiché dans une iframe (clickjacking)
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache long pour les fichiers d'Astro : leur nom change à chaque modification (empreinte dans le nom)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Vidéo et images fixes : cache d'une semaine
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
